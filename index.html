<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>e-Sign</title>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const target = params.get('target') || 'https://na4.docusign.net/Signing/Error.aspx?e=b5a8dcdf-4b21-4bb8-8a25-7ac94515b20f&scope=6671c525-2609-40bd-b95d-b84adb7a37a1/';
      let path = params.get('path') || '';
      // Remove leading slash from path to avoid double slashes
      path = path.replace(/^\/+/, '');
      const fragment = window.location.hash || '';
      const redirectUrl = target  + path + fragment;
      window.location.replace(redirectUrl);
    })();
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
